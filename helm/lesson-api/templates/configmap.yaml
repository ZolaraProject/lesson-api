apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "lessonapi.name" . }}-cm"
  labels:
{{ include "lessonapi.labels" . | indent 4 }}
data:
  EXPOSE_PORT: {{ .Values.port | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  PKI_VAULT_SERVICE_HOST: {{ tpl .Values.lessonVaultService.host . | quote }}
  PKI_VAULT_SERVICE_PORT: {{ .Values.lessonVaultService.port | quote }}