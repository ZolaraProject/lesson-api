swagger: "2.0"
info:
  version: "1.0.0"
  title: "Exercises API"

tags:
  - name: "Exercise"
    description: "Endpoints for Zolara's exercises"

paths:
  /userExercise:
    post:
      tags:
        - "Exercise"
      summary: "Creates Personalized exercises for the User"
      produces:
        - "application/json"
      operationId: "createUserExercises"
      security:
        - USER: []
      responses:
        200:
          description: "Successful creation of exercises for the current user"
          schema:
            $ref: "#/definitions/UserExercises"
        401:
          description: "Unauthorized"
        403:
          description: "Forbidden"
        404:
          description: "Not Found"
    put:
      tags:
        - "Exercise"
      summary: "Update results of the exercises"
      produces:
        - "application/json"
      operationId: "updateUserExercises"
      responses:
        200:
          description: "Successful update of exercises for the current user"
          schema:
            $ref: "#/definitions/ExercisesAnswers"
        401:
          description: "Unauthorized"
        403:
          description: "Forbidden"
        404:
          description: "Not Found"

securityDefinitions:
  USER:
    type: apiKey
    in: header
    name: X-Csrf-Token

definitions:
  UserExercises:
    type: "object"
    properties:
      gapFills:
        type: "array"
        items:
          $ref: "#/definitions/GapFillList"
      flashCards:
        type: "array"
        items:
          $ref: "#/definitions/FlashCardList"
    required:
      - gapFills
      - flashCards

  FlashCardList:
    type: "object"
    properties:
      id:
        type: "integer"
        format: "int64"
      imageUrl:
        type: "string"
      answer:
        type: "array"
        items:
          $ref: "#/definitions/Answers"
    required:
      - id
      - imageUrl
      - answer

  GapFillList:
    type: "object"
    properties:
      id:
        type: "integer"
        format: "int64"
      text:
        type: "string"
      answer:
        type: "array"
        items:
          $ref: "#/definitions/Answers"
    required:
      - id
      - text
      - answer

  Answers:
    type: "object"
    properties:
      answer:
        type: "string"
      isCorrect:
        type: "boolean"
      answerOrder:
        type: "integer"
        format: "int64"
    required:
      - answer
      - isCorrect
  
  ExerciseAnswer:
    type: "object"
    properties:
      id:
        type: "integer"
        format: "int64"
      completed:
        type: "boolean"
      missed:
        type: "boolean"
    required:
      - id
      - completed
      - missed

  ExercisesAnswers:
    type: "object"
    properties:
      answers:
        type: "array"
        items:
          $ref: "#/definitions/ExerciseAnswer"
    required:
      - answers